name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Smoke-test production server
        env:
          NODE_ENV: production
          PORT: '3000'
          GEMINI_API_KEY: ci-placeholder
        run: |
          node server.ts &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsSI http://localhost:3000/ | grep -i '^content-security-policy:'
